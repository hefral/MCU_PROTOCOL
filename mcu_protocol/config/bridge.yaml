# mcu_bridge 参数。
#
# 节点名默认为 mcu_bridge；若用 launch 改了名字，这里的键要一起改，否则参数
# 不会被加载（ROS 2 按节点名匹配，键名不符时是静默忽略，不报错）。

mcu_bridge:
  ros__parameters:
    # 串口设备。默认 /dev/mcu 是本机 udev 规则为 CH340(1a86:7523) 建的固定软链，
    # 指向当前的 ttyUSBx，插拔变号不受影响，开机即可用。规则见：
    #   /etc/udev/rules.d/99-mcu-ch340.rules
    #
    # 若在没有装该规则的机器上运行，改回真实节点或 by-id 路径均可：
    #   device: /dev/ttyUSB0
    #   device: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
    # 查看 by-id：ls -l /dev/serial/by-id/
    device: /dev/mcu

    # 波特率。协议固定 921600（MCU 实际 923077，误差 +0.16%，在容限内）。
    # 改这个值必须同时改固件，否则表现为全帧 CRC 失败。
    baud: 921600

    # 上游 ~/cmd 断流判定阈值。超过这个时长没有新命令，节点**停止发送命令帧**，
    # 交给 MCU 看门狗（200 ms 置过期位 / 500 ms 输出归零 / 2 s 重整握手）。
    #
    # 不要为了「保持链路」把它设得很大 —— 那等于让节点替上游持续重发旧命令，
    # 把「上游挂了」伪装成「一切正常」，这是最坏的失效模式。
    # 下限约束：至少三个命令周期（150 ms），否则正常调度抖动会被误判为断流。
    cmd_timeout_ms: 150

    # 下行命令帧发送频率。MCU 在 HELLO 里声明期望 20 Hz，改动前先确认固件。
    command_rate_hz: 20

    # 是否发布 ~/diagnostics（MCU 1 Hz 诊断帧）。这是链路质量的唯一窗口，
    # 调试期建议保持 true。
    publish_diagnostics: true

    # ~/imu_filtered 的一阶低通截止频率。每组数据在低通前还会经过 3 点因果中值，
    # 用于消除单帧尖峰。0 表示旁路低通，但仍保留中值滤波和安全门。
    imu_filter.accel_cutoff_hz: 5.0
    imu_filter.gyro_cutoff_hz: 5.0
    imu_filter.mag_cutoff_hz: 2.0
    imu_filter.orientation_cutoff_hz: 5.0

    # 四元数安全门。范数不在此范围内的整帧不会发布到 ~/imu_filtered；原始帧仍在
    # ~/imu_raw。默认范围能直接挡住现场出现过的全零或部分归零四元数。
    imu_filter.quaternion_norm_min: 0.8
    imu_filter.quaternion_norm_max: 1.2

    # 相邻有效四元数允许的最大姿态变化率。超过时拒绝整帧；0 表示关闭该项安全门。
    # 该值必须高于载体真实可能达到的最大角速度，并留出采样抖动余量。
    imu_filter.max_orientation_rate_deg_s: 720.0
